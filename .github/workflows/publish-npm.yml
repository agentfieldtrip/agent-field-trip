# Publishes packages/js to npm when a GitHub release is published.
# Uses npm Trusted Publishing (OIDC): no npm token is stored anywhere. Configure it once on npmjs.com, in the
# package settings of `agentfieldtrip` (repository: agentfieldtrip/agent-field-trip, workflow: publish-npm.yml,
# environment: npm). The very first version is published by hand, because npm only offers this for existing packages.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Release tag must match the package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
