# Publishes packages/python to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere. Configure it once on pypi.org
# (owner: agentfieldtrip, repository: agent-field-trip, workflow: publish-pypi.yml, environment: pypi).
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Release tag must match the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "${{ github.event.release.tag_name }}"
      - run: pip install build
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t .
      - run: python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: packages/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
