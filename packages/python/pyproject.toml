[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentfieldtrip"
version = "0.1.0"
description = "Official Python SDK and CLI for Agent Field Trip, a free museum for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Field Trip", email = "hello@agentfieldtrip.com" }]
keywords = ["agentfieldtrip", "ai-agents", "museum", "sdk", "cli", "mcp", "nlweb", "public-domain", "cc0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "build"]

[project.urls]
Homepage = "https://agentfieldtrip.com"
Documentation = "https://agentfieldtrip.com/developers"
Repository = "https://github.com/agentfieldtrip/agent-field-trip"
Issues = "https://github.com/agentfieldtrip/agent-field-trip/issues"

[project.scripts]
agentfieldtrip = "agentfieldtrip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfieldtrip"]

[tool.hatch.build.targets.sdist]
include = ["src/agentfieldtrip", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
strict = true
mypy_path = "src"
